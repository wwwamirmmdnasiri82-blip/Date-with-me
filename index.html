<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Date With Me 💜</title>

<meta name="theme-color" content="#6d4aff">

<meta name="description" content="Date With Me">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="hearts"></div>

<div class="background"></div>

<button id="musicBtn" title="موزیک">
🔊
</button>

<audio id="bgMusic" loop preload="auto">
<source src="music.mp3" type="audio/mpeg">
</audio>

<div class="container">

<div id="page-name" class="page active">

<h1>
💜 یه چیزی هست که باید بگم...
</h1>

<p>
اسمت رو وارد کن تا شروع کنیم
</p>

<input
type="text"
id="nameInput"
maxlength="25"
autocomplete="off"
placeholder="اسمت رو بنویس..."
>

<button onclick="goToQuestion()">
بزن بریم 🚀
</button>

</div>

<div id="page-question" class="page">

<h1>
دوست داری با من بیای بیرون؟ 💕
</h1>

<p>
یه جواب صادقانه بده...
</p>

<div class="btn-group">

<button
class="btn-yes"
onclick="answerYes()">

آره 💖

</button>

<button
class="btn-no"
id="noBtn">

نه 😢

</button>

</div>

</div>

<div id="page-food" class="page">

<h1>
خب حالا بگو چی دوست داری؟ 🍽
</h1>

<p>
یکی رو انتخاب کن
</p>

<div class="food-options">

<button onclick="selectFood('🍕 پیتزا')">
🍕 پیتزا
</button>

<button onclick="selectFood('☕ قهوه')">
☕ قهوه
</button>

<button onclick="selectFood('🥩 کباب')">
🥩 کباب
</button>

<button onclick="selectFood('🍦 بستنی')">
🍦 بستنی
</button>

</div>

</div>

<div id="page-date" class="page">

<h1>
📅 تاریخ قرار
</h1>

<p>
تاریخ و ساعت رو انتخاب کن
</p>

<input
type="date"
id="dateInput"
>

<input
type="time"
id="timeInput"
>

<button onclick="goToShare()">
ادامه ✨
</button>

</div>

<div id="page-share" class="page">

<h1>
🎉 همه چیز آماده است
</h1>

<p>
این لینک رو برای طرف مقابل بفرست
</p>

<div class="link-box">

<input
type="text"
id="shareLink"
readonly
>

<button onclick="copyLink()">

کپی 📋

</button>

</div>

<div class="summary">

<p>
👤
<span id="summaryName"></span>
</p>

<p>
🍽
<span id="summaryFood"></span>
</p>

<p>
📅
<span id="summaryDate"></span>
</p>

<p>
🕒
<span id="summaryTime"></span>
</p>

</div>

<p class="hint">

💜 امیدوارم جوابش مثبت باشه...

</p>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js"></script>

</body>

</html>
